# Builds and tests the Mac app on GitHub's macOS runner. Copied to .github/workflows/ of the
# private build repo by mac/build-on-github.ps1.
name: Build Mac app
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: bash mac/build.sh
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Firebase rules regression tests
        run: npm ci --prefix tools && npm --prefix tools run test:rules
      - name: Self-test with the mock Firebase
        run: |
          node tools/mock-firebase.js > mock.log 2>&1 &
          sleep 1
          mac/build/StudyPet.app/Contents/MacOS/StudyPet --selftest "$PWD/selftest" http://127.0.0.1:8790/rooms/selftestroom0000001
      - name: Self-test of Intel binary
        run: arch -x86_64 mac/build/StudyPet.app/Contents/MacOS/StudyPet --selftest "$PWD/selftest-intel"
      - name: Install and update the local build
        run: |
          python3 -m http.server 18798 --directory mac/build > install-http.log 2>&1 &
          sleep 1
          export STUDYPET_CHANNEL=http://127.0.0.1:18798
          app="$HOME/Applications/StudyPet.app/Contents/MacOS/StudyPet"
          bash mac/install-mac.sh
          sleep 2
          before="$(pgrep -f "$app")"
          test -n "$before"
          bash mac/install-mac.sh
          sleep 2
          after="$(pgrep -f "$app")"
          test -n "$after" && test "$before" != "$after"
          cp mac/build/StudyPet-mac.zip.sha256 mac/build/expected.sha256
          printf 'bad-checksum' > mac/build/StudyPet-mac.zip.sha256
          if bash mac/install-mac.sh; then echo 'bad checksum was accepted'; exit 1; fi
          test "$(pgrep -f "$app")" = "$after"
          mv mac/build/expected.sha256 mac/build/StudyPet-mac.zip.sha256
          pkill -TERM -f "$app"
          for _ in {1..40}; do pgrep -f "$app" >/dev/null || break; sleep 0.2; done
          if pgrep -f "$app"; then echo 'normal termination failed'; exit 1; fi
      - name: Install script syntax
        run: bash -n mac/install-mac.sh
      - name: In-app updater and session restoration
        run: bash mac/test-updater.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: selftest
          path: |
            selftest
            selftest-intel/selftest.txt
            mock.log
      - uses: actions/upload-artifact@v5
        with:
          name: StudyPet-mac
          path: |
            mac/build/StudyPet-mac.zip
            mac/build/StudyPet-mac.zip.sha256
            mac/install-mac.sh
          if-no-files-found: error

name: Test live release channel
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version signal to wait for
        required: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - run: bash mac/build.sh
      - run: mac/build/StudyPet.app/Contents/MacOS/StudyPet --release-probe "$PWD/release-probe.txt" "$EXPECTED_TAG"
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: release-probe
          path: release-probe.txt
